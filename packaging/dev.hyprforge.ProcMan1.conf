<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for hyprforge-procman's helper, installed to
  /usr/share/dbus-1/system.d/. Only root may own the name. Anyone may
  call it, because the helper asks polkit about every caller itself —
  the bus deciding here would decide without knowing what was asked.
-->
<busconfig>
  <policy user="root">
    <allow own="dev.hyprforge.ProcMan1"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.hyprforge.ProcMan1" send_interface="dev.hyprforge.ProcMan1"/>
    <allow send_destination="dev.hyprforge.ProcMan1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="dev.hyprforge.ProcMan1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
