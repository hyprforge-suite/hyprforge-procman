[package]
name = "hyprforge-procman"
version = "0.1.12"
edition = "2021"
license = "MIT"
description = "A process manager for Hyprland: what is running, what it costs, and which window it belongs to — read from /proc, drawn in the suite's look."
repository = "https://github.com/hyprforge-suite/hyprforge-procman"
readme = "README.md"
keywords = ["hyprland", "process", "task-manager", "iced", "linux"]
categories = ["os::linux-apis", "gui"]
# A component, not a library: nothing here is meant to be depended on,
# and crates.io is where the suite's libraries live.
publish = false

# Four programs, one crate (a package's binaries must live in one crate
# directory: the suite's CLAUDE.md, "a binary cannot be fetched"), and
# features so that each links only what it uses — above all the root
# recorder, which must not carry a GUI toolkit or a D-Bus stack into a
# process that runs as root all day.
[features]
default = ["gui"]
# The window.
gui = ["dbus", "desktop", "dep:iced", "dep:hyprforge-ui", "dep:hyprforge-look", "dep:hyprforge-keys", "dep:hyprforge-appearance"]
# The helper's service and its clients; systemd and logind.
dbus = ["dep:zbus", "dep:tokio"]
# What only a desktop session has: Hyprland's startup programs, app names.
desktop = ["dep:hyprforge-session", "dep:hyprforge-mime"]
# The terminal UI.
tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "hyprforge-procman"
path = "src/main.rs"
required-features = ["gui"]

# The privileged half: a system D-Bus service that runs as root, checks
# polkit for every call, and takes only typed arguments.
[[bin]]
name = "hyprforge-procman-helper"
path = "src/bin/helper.rs"
required-features = ["dbus"]

# Samples the machine every ten seconds into a private journal, as root.
# No features: it links neither iced nor zbus.
[[bin]]
name = "hyprforge-procman-recorder"
path = "src/bin/recorder.rs"

[dependencies]
# By crates.io version, as every component names its siblings — see the
# suite's CLAUDE.md on `[patch.crates-io]`.
hyprforge-ui = { version = "0.1", optional = true }
hyprforge-look = { version = "0.1", optional = true }
hyprforge-keys = { version = "0.1", optional = true }
hyprforge-appearance = { version = "0.1", optional = true }
# `hyprctl clients -j`, and every other program waited on, with the
# suite's bound on how long another program may take to answer.
hyprforge-process = "0.1"
# Hyprland's startup programs, read from the file Settings' Session page
# keeps — through its own module, which owns that file.
hyprforge-session = { version = "0.1", optional = true }
hyprforge-paths = "0.1"
# App names for window classes: on Wayland a class is the app id, which
# is the launcher entry's file name — and the entry has the name to show.
hyprforge-mime = { version = "0.1", optional = true }
# `canvas` for the history graphs, on top of the suite's base set.
iced = { version = "0.14", optional = true, default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "tokio",
    "canvas",
] }
tokio = { version = "1.53", optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# getpwuid_r for user names, and pidfd_open / pidfd_send_signal, so a
# signal reaches the process that was chosen and never one that reused
# its number.
libc = "0.2"
# When a process started, in the reader's own time zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The helper's service and the window's client of it, on the system bus.
zbus = { version = "5.18", optional = true, default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The recorder's journal: frames in postcard, compressed with zstd (each
# against the last keyframe as its dictionary), every record CRC-checked.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
zstd = "0.13"
crc32fast = "1.5"
# The terminal UI.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"
# The ignored render test only: draws each tab to a PNG to look at.
iced_tiny_skia = { version = "0.14.1", default-features = false }
iced_runtime = "0.14"
tiny-skia = "0.11"
# The helper's tests talk to it over a socket pair, no bus needed.
zbus = { version = "5.18", default-features = false, features = ["tokio", "p2p"] }
